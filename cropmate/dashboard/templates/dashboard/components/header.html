<!-- Clean Header for Floating Layout -->
<header class="bg-white border-b border-gray-100">
    <div class="flex items-center justify-between px-6 lg:px-8 h-16">
        <!-- Left -->
        <div class="flex items-center space-x-4">
            <button id="sidebarToggle" class="lg:hidden w-10 h-10 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl flex items-center justify-center transition">
                <i class="fas fa-bars"></i>
            </button>
            <div>
                <h1 class="text-lg font-bold text-gray-800">{{ page_header_title|default:"Dashboard" }}</h1>
                <p class="text-xs text-gray-500 hidden sm:block">{{ page_header_subtitle|default:"Overview" }}</p>
            </div>
        </div>
        
        <!-- Right -->
        <div class="flex items-center space-x-3">
            {{ page_header_extra|safe }}
            
            <!-- Search -->
            <div class="hidden md:flex items-center bg-gray-50 rounded-xl px-4 py-2.5">
                <i class="fas fa-search text-gray-400 text-sm mr-2"></i>
                <input type="text" placeholder="Search..." class="bg-transparent text-sm w-40 outline-none text-gray-700">
            </div>
            
            <!-- Notifications -->
            <button class="relative w-10 h-10 bg-gray-50 hover:bg-gray-100 rounded-xl flex items-center justify-center transition">
                <i class="fas fa-bell text-gray-500"></i>
                <span class="absolute -top-1 -right-1 w-5 h-5 bg-violet-500 text-white text-xs rounded-full flex items-center justify-center font-bold">3</span>
            </button>
            
            <!-- User -->
            <div class="w-10 h-10 bg-gradient-to-br from-violet-500 to-purple-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg shadow-violet-500/30">
                {{ user.username|slice:":1"|upper }}
            </div>
        </div>
    </div>
</header>
